[build]
  command = "npm run build -w @tour/shared && npm run build -w @tour/web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_URL = "https://delta-travel-api.onrender.com/api/v1"
  NEXT_PUBLIC_SITE_URL = "https://deltatravel.netlify.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
