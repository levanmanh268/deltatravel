name: Temporary Netlify Production Diagnostic

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

permissions:
  contents: read

jobs:
  netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 72ffdad294aa7b60fa5a532c0aeff25219d56282
      NETLIFY_URL: https://deltatravel.netlify.app
    steps:
      - name: Wait for exact Netlify main release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsS --max-time 20 "$NETLIFY_URL/api/release" || true)"
            COMMIT="$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)"
            PROVIDER="$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("provider") or "")' 2>/dev/null || true)"
            echo "attempt=$attempt expected=$EXPECTED_SHA commit=$COMMIT provider=$PROVIDER body=$BODY"
            if [ "$COMMIT" = "$EXPECTED_SHA" ] && [ "$PROVIDER" = "netlify" ]; then
              echo "NETLIFY_EXACT_RELEASE_PASS"
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "Timed out waiting for exact Netlify release" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Verify hardened public routes and headers
        shell: bash
        run: |
          set -euo pipefail
          for route in / /tours /assistant /login /register /forgot-password /robots.txt /sitemap.xml; do
            code="$(curl -LsS -o /tmp/body --max-time 30 -w '%{http_code}' "$NETLIFY_URL$route")"
            echo "$route => $code"
            test "$code" -lt 400
          done
          headers="$(curl -fsSI --max-time 30 "$NETLIFY_URL/" | tr -d '\r')"
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security:'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options:'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options:'
      - name: Verify stale marketing claims are absent
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$NETLIFY_URL/" -o /tmp/home.html
          ! grep -q '25,000+' /tmp/home.html
          ! grep -q '99.8%' /tmp/home.html
          ! grep -q '1900 6868' /tmp/home.html
          echo "NETLIFY_HARDENING_CONTENT_PASS"
