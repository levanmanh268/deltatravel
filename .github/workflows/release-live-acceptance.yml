name: Release Live Acceptance

on:
  push:
    branches:
      - manh/integrate-production-api

permissions:
  contents: read

jobs:
  wait-for-deploy:
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait until Render serves this exact commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://delta-travel-web.onrender.com/api/release
        run: |
          for attempt in $(seq 1 50); do
            BODY="$(curl -fsS --max-time 15 "$RELEASE_URL" || true)"
            ACTUAL="$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)"
            echo "attempt=$attempt expected=$EXPECTED_SHA actual=$ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "Render is serving the exact release commit."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the exact Render commit." >&2
          exit 1

  live:
    needs: wait-for-deploy
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify:live
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1

  browser:
    needs: wait-for-deploy
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run verify:browser
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com

  accessibility:
    needs: wait-for-deploy
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:a11y
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com

  staging-mutation:
    needs: wait-for-deploy
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify:staging
        env:
          VERIFY_API_URL: https://delta-travel-api.onrender.com/api/v1
          VERIFY_ORIGIN: https://delta-travel-web.onrender.com
          VERIFY_ALLOW_MUTATIONS: 'true'

  security:
    needs: wait-for-deploy
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify:security
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1

  ai-first:
    needs: wait-for-deploy
    if: contains(github.event.head_commit.message, '[live-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ai-first-live
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com
