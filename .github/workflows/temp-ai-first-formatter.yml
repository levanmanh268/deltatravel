name: Temporary AI First Formatter

on:
  push:
    branches:
      - manh/ai-first-everywhere

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/ai-first-everywhere
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: rm .github/workflows/temp-ai-first-formatter.yml
      - name: Commit normalized AI-first tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format AI-first experience"
          git push origin HEAD:manh/ai-first-everywhere
