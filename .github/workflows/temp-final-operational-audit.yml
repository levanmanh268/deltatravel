name: Temporary Final Operational Audit

on:
  push:
    branches:
      - manh/final-operational-audit

permissions:
  contents: read

jobs:
  operational:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Security boundary smoke
        run: npm run verify:security
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1
      - name: Burst smoke
        run: npm run verify:burst
        env:
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1
          BURST_REQUESTS: '60'
          BURST_CONCURRENCY: '10'
          BURST_P95_LIMIT_MS: '15000'
