name: Temporary Final Formatter

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format final hardening')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: manh/final-hardening-v3-20260930
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Format only files changed from production base
        shell: bash
        run: |
          git fetch origin manh/integrate-production-api
          git diff -z --name-only origin/manh/integrate-production-api...HEAD \
            | grep -zE '\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss|html|prisma)$' \
            | xargs -0 --no-run-if-empty npx prettier --write
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Delta Travel CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format final hardening"
          git push origin HEAD:manh/final-hardening-v3-20260930
