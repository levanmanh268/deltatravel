name: Live Smoke
on:
  push:
    branches: [manh/stage-ai-first-frontend]
    paths:
      - .github/workflows/live-smoke.yml
      - scripts/live-e2e-smoke.mjs
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/live-e2e-smoke.mjs
