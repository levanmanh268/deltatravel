name: Temporary Contract Example Patch

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: refresh contract examples')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-hardening-v3-20260930
      - name: Patch contract examples
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/generate-contract.mjs")
          s = p.read_text()
          old = """  departureAt: departure,
          totalSeats: 30,"""
          new = """  departureAt: departure,
          durationDays: 3,
          totalSeats: 30,"""
          if old not in s:
              raise SystemExit("schedule anchor not found")
          s = s.replace(old, new, 1)
          old2 = """const booking = {
            id: bid,
            ...createBooking,
            status: 'PENDING_PAYMENT',"""
          new2 = """const booking = {
            id: bid,
            ...createBooking,
            tourId: id,
            status: 'PENDING_PAYMENT',"""
          if old2 not in s:
              raise SystemExit("booking anchor not found")
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Delta Travel CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/generate-contract.mjs
          git commit -m "fix: refresh contract examples"
          git push origin HEAD:manh/final-hardening-v3-20260930
