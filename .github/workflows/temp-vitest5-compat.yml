name: Temporary Vitest 5 Compatibility

on:
  push:
    branches:
      - manh/final-complete-v4

permissions:
  contents: write

jobs:
  compat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tour
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: tour_booking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tour -d tour_booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://tour:ci_only@localhost:5432/tour_booking_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_only_secret_with_at_least_32_characters
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-complete-v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade Vitest in working tree only
        run: npm install -w @tour/api --save-dev vitest@5.0.2
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --json
      - run: rm .github/workflows/temp-vitest5-compat.yml
      - name: Commit cleanup only
        if: always()
        run: |
          git restore apps/api/package.json package-lock.json || true
          rm -f .github/workflows/temp-vitest5-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary Vitest compatibility workflow"
            git push origin HEAD:manh/final-complete-v4
          fi
