name: Normalize Tham admin tour ops

on:
  push:
    branches:
      - manh/tham-admin-tour-ops-20261007

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[tham-normalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/tham-admin-tour-ops-20261007
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Format source
        run: npm run format
      - name: Regenerate API contract
        run: npm run docs:generate
      - name: Format generated contract
        run: npx prettier --write docs/API_CONTRACT.md docs/openapi.json
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "delta-travel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "chore: normalize Tham admin tour operations [tham-normalize]"
          git push origin HEAD:manh/tham-admin-tour-ops-20261007
