name: UX hardening maintenance

on:
  push:
    branches:
      - manh/ux-hardening-20261007

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[ux-maintenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/ux-hardening-20261007
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Format changed UX files
        run: |
          npx prettier --write \
            apps/web/src/lib/asset-preloader.ts \
            apps/web/src/lib/site-config.ts \
            apps/web/src/components/luxury-preloader.tsx \
            apps/web/src/components/scroll-3d-hero.tsx \
            apps/web/src/components/giant-scroll-typography.tsx \
            apps/web/src/components/footer.tsx \
            apps/web/src/components/ai-agent-launcher.tsx \
            apps/web/src/components/agent-booking-panel.tsx \
            apps/web/src/components/auth-form.tsx \
            "apps/web/src/app/page.tsx" \
            "apps/web/src/app/(public)/tours/page.tsx" \
            "apps/web/src/app/(public)/tours/[id]/layout.tsx" \
            "apps/web/src/app/(public)/support/page.tsx" \
            "apps/web/src/app/(public)/terms/page.tsx" \
            "apps/web/src/app/(public)/privacy/page.tsx" \
            "apps/web/src/app/(public)/payment-policy/page.tsx" \
            "apps/web/src/app/(account)/layout.tsx" \
            "apps/web/src/app/(account)/checkout/[scheduleId]/page.tsx" \
            "apps/web/src/app/(account)/bookings/[id]/page.tsx" \
            apps/web/src/app/assistant/page.tsx \
            apps/web/src/app/admin/page.tsx \
            apps/web/src/app/sitemap.ts \
            apps/api/src/admin/admin.service.ts \
            apps/api/src/bookings/dto.ts \
            packages/shared/src/index.ts
      - name: Regenerate API contract
        run: |
          npm run docs:generate
          npx prettier --write docs/API_CONTRACT.md docs/openapi.json
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "delta-travel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "chore: normalize UX hardening sources and contracts [ux-maintenance]"
          git push origin HEAD:manh/ux-hardening-20261007
