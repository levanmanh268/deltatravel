name: Temporary Netlify Introspection

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Netlify public site metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SITE METADATA BY NAME ==="
          curl -i -sS --max-time 30 https://api.netlify.com/api/v1/sites/deltatravel.netlify.app || true
          echo
          echo "=== PUBLIC HEADERS ==="
          curl -I -sS --max-time 30 https://deltatravel.netlify.app/ || true
          echo
          echo "=== RELEASE ==="
          curl -sS --max-time 30 https://deltatravel.netlify.app/api/release || true
