name: Temporary Netlify Production Check

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Netlify public deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "ROOT_STATUS=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --max-time 30 https://deltatravel.netlify.app/)"
          echo "ROOT_BYTES=$(wc -c < /tmp/root.html)"
          echo "RELEASE_STATUS=$(curl -L -sS -o /tmp/release.json -w '%{http_code}' --max-time 30 https://deltatravel.netlify.app/api/release || true)"
          echo "RELEASE_BODY=$(cat /tmp/release.json 2>/dev/null || true)"
          grep -q "DELTA" /tmp/root.html && echo "NETLIFY_ROOT_CONTENT_PASS"
