name: Temporary AI Detail Diagnostic

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Inspect first live tour detail
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}});
          page.on('response', (r) => {
            if (r.url().includes('/api/v1/tours') || r.url().includes('/api/v1/schedules')) {
              console.log('API_RESPONSE', r.status(), r.url());
            }
          });
          await page.addInitScript(() => sessionStorage.setItem('delta_intro_played','true'));
          const listResp = await page.goto('https://delta-travel-web.onrender.com/tours', {waitUntil:'domcontentloaded', timeout:120000});
          console.log('LIST_STATUS', listResp?.status());
          await page.waitForTimeout(2500);
          const hrefs = await page.locator('a[href^="/tours/"]').evaluateAll((els) => els.slice(0,10).map(e => e.getAttribute('href')));
          console.log('HREFS', JSON.stringify(hrefs));
          const href = hrefs.find(Boolean);
          if (!href) throw new Error('No tour detail href');
          const detailResp = await page.goto('https://delta-travel-web.onrender.com' + href, {waitUntil:'domcontentloaded', timeout:120000});
          console.log('DETAIL_STATUS', detailResp?.status(), 'URL', page.url(), 'HREF', href);
          await page.waitForTimeout(5000);
          console.log('AI_CARD_COUNT_5S', await page.locator('[data-ai-surface="context-card"]').count());
          console.log('BODY_5S', (await page.locator('body').innerText()).slice(0,1800));
          await page.waitForTimeout(25000);
          console.log('AI_CARD_COUNT_30S', await page.locator('[data-ai-surface="context-card"]').count());
          console.log('BODY_30S', (await page.locator('body').innerText()).slice(0,1800));
          await browser.close();
          JS
