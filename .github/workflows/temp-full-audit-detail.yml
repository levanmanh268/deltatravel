name: Temporary Full Audit Detail

on:
  push:
    branches:
      - manh/final-complete-v4

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-complete-v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print full audit report
        run: npm audit --json || true
      - run: rm .github/workflows/temp-full-audit-detail.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary full audit workflow"
          git push origin HEAD:manh/final-complete-v4
