name: Temporary Current Hardening Formatter

on:
  push:
    branches:
      - manh/integrate-production-api

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format current hardening')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        shell: bash
        run: |
          ./node_modules/.bin/prettier --write "apps/web/src/providers/language-provider.tsx" "apps/web/src/components/footer.tsx" "apps/web/src/app/page.tsx" "apps/web/src/app/(public)/tours/page.tsx" "apps/web/src/app/layout.tsx" "apps/web/next.config.ts"
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Delta Travel CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format current hardening"
          git push origin HEAD:manh/integrate-production-api
