name: Temporary Netlify Production Probe

# rerun-tour-detail-after-schedule-durationDays-client-compat-fix

on:
  push:
    branches:
      - fix/netlify-contract-skew-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser probe
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe Netlify production
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const WEB = 'https://deltatravel.netlify.app';
          const API = 'https://delta-travel-api.onrender.com/api/v1';

          const legacyResponse = await fetch(API + '/tours?page=1&pageSize=2');
          if (!legacyResponse.ok) throw new Error('Legacy tour API returned ' + legacyResponse.status);
          const legacy = await legacyResponse.json();
          const legacyKeys = Object.keys(legacy?.data?.items?.[0] ?? legacy?.items?.[0] ?? {});
          for (const forbidden of ['imageUrl','galleryImages','itinerary','commercial','fromPrice','ratingAverage','ratingCount']) {
            if (legacyKeys.includes(forbidden)) throw new Error('Legacy contract leaked v2 key: ' + forbidden);
          }
          console.log('LEGACY_TOUR_CONTRACT_PASS', legacyKeys.join(','));

          const v2Response = await fetch(API + '/tours?page=1&pageSize=2&contract=v2');
          if (!v2Response.ok) throw new Error('V2 tour API returned ' + v2Response.status);
          const v2 = await v2Response.json();
          const v2Keys = Object.keys(v2?.data?.items?.[0] ?? v2?.items?.[0] ?? {});
          for (const required of ['imageUrl','galleryImages','itinerary','commercial','fromPrice','ratingAverage','ratingCount']) {
            if (!v2Keys.includes(required)) throw new Error('V2 contract missing key: ' + required);
          }
          console.log('V2_TOUR_CONTRACT_PASS', v2Keys.join(','));

          const releaseResponse = await fetch(WEB + '/api/release', { cache: 'no-store' });
          if (!releaseResponse.ok) {
            throw new Error('Netlify /api/release returned ' + releaseResponse.status);
          }
          const release = await releaseResponse.json();
          console.log('NETLIFY_RELEASE', JSON.stringify(release));

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            await page.addInitScript(() => sessionStorage.setItem('delta_intro_played', 'true'));

            const fatalMarkers = [
              'Không thể tải catalog tour production',
              'unrecognized_keys',
              'API_CONTRACT_MISMATCH',
              'Website và máy chủ đang chưa đồng bộ phiên bản dữ liệu',
            ];

            const homeResponse = await page.goto(WEB + '/', {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });
            console.log('NETLIFY_HOME_HTTP', homeResponse?.status());
            await page.waitForTimeout(8000);
            const homeBody = await page.locator('body').innerText();
            for (const marker of fatalMarkers) {
              if (homeBody.includes(marker)) {
                throw new Error('Netlify home still exposes catalog contract failure: ' + marker);
              }
            }
            const homeTourLinks = await page.locator('a[href^="/tours/"]').count();
            console.log('NETLIFY_HOME_TOUR_LINKS', homeTourLinks);
            if (homeTourLinks < 1) throw new Error('Netlify home rendered no tour links');

            const response = await page.goto(WEB + '/tours', {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });
            console.log('NETLIFY_TOURS_HTTP', response?.status());
            await page.waitForTimeout(8000);

            const body = await page.locator('body').innerText();
            for (const marker of fatalMarkers) {
              if (body.includes(marker)) {
                throw new Error('Netlify production still exposes catalog contract failure: ' + marker);
              }
            }

            const tourLinks = await page.locator('a[href^="/tours/"]').count();
            console.log('NETLIFY_TOUR_LINKS', tourLinks);
            if (tourLinks < 1) {
              throw new Error('Netlify production rendered no tour cards');
            }

            const firstHref = await page.locator('a[href^="/tours/"]').first().getAttribute('href');
            if (!firstHref) throw new Error('Unable to resolve first Netlify tour detail URL');
            const detailResponse = await page.goto(WEB + firstHref, {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });
            console.log('NETLIFY_DETAIL_HTTP', detailResponse?.status(), firstHref);
            await page.waitForTimeout(8000);
            const detailBody = await page.locator('body').innerText();
            for (const marker of fatalMarkers) {
              if (detailBody.includes(marker)) {
                throw new Error('Netlify detail still exposes catalog contract failure: ' + marker);
              }
            }
            if (!detailBody.includes('LỊCH KHỞI HÀNH') && !detailBody.includes('DEPARTURE')) {
              throw new Error('Netlify tour detail did not render the departure section');
            }
            console.log('NETLIFY_DETAIL_PROBE_PASS');

            if (pageErrors.length) {
              throw new Error('Netlify page errors: ' + pageErrors.join(' | '));
            }

            console.log('NETLIFY_CATALOG_PROBE_PASS');
          } finally {
            await browser.close();
          }
          JS
