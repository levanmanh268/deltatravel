name: Temporary Latest Formatter

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format latest fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: manh/final-hardening-v3-20260930
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Format latest changed files
        shell: bash
        run: |
          ./node_modules/.bin/prettier --write \
            "apps/web/src/lib/fallback-data.ts" \
            "apps/web/src/app/admin/tours/[id]/content/page.tsx" \
            "apps/web/src/app/admin/tours/page.tsx"
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Delta Travel CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format latest fixes"
          git push origin HEAD:manh/final-hardening-v3-20260930
