name: Temporary Detail Diagnostic

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Diagnose live detail
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const WEB='https://delta-travel-web.onrender.com';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.on('response', async (r) => {
            if (r.url().includes('/api/v1/tours')) {
              console.log('TOUR_API', r.status(), r.url());
            }
          });
          page.on('console', msg => console.log('BROWSER_CONSOLE', msg.type(), msg.text()));
          page.on('pageerror', err => console.log('PAGE_ERROR', String(err)));
          await page.goto(WEB+'/tours',{waitUntil:'domcontentloaded',timeout:120000});
          const card=page.locator('a.liquid-glass-card[href^="/tours/"]').first();
          await card.waitFor({state:'visible',timeout:30000});
          const href=await card.getAttribute('href');
          console.log('DETAIL_HREF', href);
          const resp=await page.goto(WEB+href,{waitUntil:'domcontentloaded',timeout:120000});
          console.log('DETAIL_DOC_STATUS', resp?.status(), page.url());
          await page.waitForTimeout(15000);
          console.log('ADVISOR_COUNT', await page.locator('[data-ai-surface="context-card"]').count());
          console.log('BODY', (await page.locator('body').innerText()).slice(0,5000));
          await browser.close();
          JS
