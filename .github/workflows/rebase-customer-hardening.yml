name: Rebase customer hardening onto current main

on:
  push:
    branches:
      - manh/ux-hardening-20261007

permissions:
  contents: write

jobs:
  rebase_patch:
    if: ${{ !contains(github.event.head_commit.message, '[main-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/ux-hardening-20261007
          fetch-depth: 0
      - name: Reapply reviewed customer hardening onto current main
        run: |
          set -euo pipefail
          git config user.name "delta-travel-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git diff --binary 823b980c0ef1c46c711f4030c40b9579ecfe40b3 9fe834a95a968c7d42e507a7e55e77f37ee715fa > /tmp/customer-hardening.patch
          git switch -C manh/ux-hardening-main-sync-20261007 origin/main
          if ! git apply --3way --index /tmp/customer-hardening.patch; then
            echo 'Patch application failed. Conflicts:'
            git status --short
            exit 1
          fi
          git commit -m "ux: customer journey hardening rebased onto current main [main-sync]"
          git push origin HEAD:manh/ux-hardening-main-sync-20261007
