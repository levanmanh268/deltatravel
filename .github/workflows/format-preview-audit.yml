name: Audit Formatter Preview (Temporary)
on:
  push:
    branches: [audit/final-intent-validation-20261013]
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Format changed files in runner only
        run: npx prettier --write apps/api/src/assistant/ai-provider.service.ts apps/api/test/unit/assistant.test.ts
      - name: Print exact canonical code changes
        run: git diff -- apps/api/src/assistant/ai-provider.service.ts apps/api/test/unit/assistant.test.ts
