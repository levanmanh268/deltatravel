name: One-time navbar formatting

on:
  push:
    branches:
      - manh/integrate-production-api
    paths:
      - .github/workflows/format-navbar-once.yml
      - apps/web/src/components/nav.tsx

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/components/nav.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/nav.tsx
          git commit -m "style: prettier scroll-aware navbar"
          git push origin HEAD:manh/integrate-production-api
