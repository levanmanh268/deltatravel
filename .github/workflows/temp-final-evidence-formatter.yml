name: Temporary Final Evidence Formatter

on:
  push:
    branches:
      - manh/final-release

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final evidence files
        run: |
          npx prettier --write .github/workflows/ci.yml .github/workflows/operational-verification.yml README.md docs/DEPLOYMENT.md docs/VERIFICATION.md docs/PRODUCTION_READINESS.md docs/TEST_PLAN.md scripts/security-smoke.mjs scripts/burst-smoke.mjs package.json
          rm .github/workflows/temp-final-evidence-formatter.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format final verification evidence"
          git push origin HEAD:manh/final-release
