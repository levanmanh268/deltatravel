name: Temporary Operational Docs Formatter

on:
  push:
    branches:
      - manh/final-release

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md docs/VERIFICATION.md docs/PRODUCTION_READINESS.md docs/TEST_PLAN.md
      - run: rm .github/workflows/temp-operational-docs-formatter.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format final operational evidence"
          git push origin HEAD:manh/final-release
