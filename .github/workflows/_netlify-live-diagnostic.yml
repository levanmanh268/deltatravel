name: Temporary Netlify Live Diagnostic

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Netlify and API contracts
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const targets = [
            'https://deltatravel.netlify.app/api/release',
            'https://delta-travel-web.onrender.com/api/release',
            'https://delta-travel-api.onrender.com/api/v1/tours?page=1&pageSize=2',
          ];
          for (const url of targets) {
            try {
              const r = await fetch(url, { redirect: 'follow' });
              const text = await r.text();
              console.log('\nURL', url);
              console.log('STATUS', r.status);
              console.log('HEADERS', JSON.stringify(Object.fromEntries(r.headers.entries())));
              console.log('BODY', text.slice(0, 12000));
            } catch (error) {
              console.log('\nURL', url, 'ERROR', String(error));
            }
          }
          JS
