name: Temporary Production Smoke

# production-rerun-after-a11y-fix
# final-production-rerun-after-test-stabilization

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_WEB_URL: https://delta-travel-web.onrender.com
      LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install live-test browser dependencies
        run: npm install --no-save playwright @axe-core/playwright
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox
      - name: Live API and route smoke
        run: npm run verify:live
      - name: Security smoke
        run: npm run verify:security
      - name: Browser smoke
        run: npm run verify:browser
      - name: Accessibility smoke
        run: npm run verify:a11y
      - name: AI-first live acceptance
        run: npm run verify:ai-first-live
