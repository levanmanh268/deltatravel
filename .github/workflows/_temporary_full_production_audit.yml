name: Temporary Full Production Audit

on:
  push:
    branches:
      - audit/full-production-20261001

permissions:
  contents: read

jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: render
            web: https://delta-travel-web.onrender.com
          - name: netlify
            web: https://deltatravel.netlify.app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Live smoke
        run: npm run verify:live
        env:
          LIVE_WEB_URL: ${{ matrix.web }}
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1
      - name: Security smoke
        run: npm run verify:security
        env:
          LIVE_WEB_URL: ${{ matrix.web }}
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1

  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: render
            web: https://delta-travel-web.onrender.com
          - name: netlify
            web: https://deltatravel.netlify.app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser smoke
        run: npm run verify:browser
        env:
          LIVE_WEB_URL: ${{ matrix.web }}
      - name: Accessibility audit
        run: npm run verify:a11y
        env:
          LIVE_WEB_URL: ${{ matrix.web }}
      - name: AI-first acceptance
        run: npm run verify:ai-first-live
        env:
          LIVE_WEB_URL: ${{ matrix.web }}
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1
