name: Temporary Release Formatter

on:
  push:
    branches:
      - manh/final-release

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final release files
        run: |
          npx prettier --write apps/web/src/app/page.tsx "apps/web/src/app/(public)/tours/page.tsx" apps/web/src/app/assistant/page.tsx apps/web/src/components/footer.tsx apps/web/src/components/ai-agent-launcher.tsx scripts/a11y-smoke.mjs .github/workflows/ci.yml .github/workflows/live-verification.yml .github/workflows/staging-e2e.yml .github/workflows/browser-verification.yml .github/workflows/accessibility-verification.yml .github/workflows/publish.yml
          rm .github/workflows/temp-release-formatter.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format final release accessibility hardening"
          git push origin HEAD:manh/final-release
