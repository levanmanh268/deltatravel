name: Temporary Format Release Route

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/app/api/release/route.ts
      - name: Commit formatted route
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Delta Travel CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/app/api/release/route.ts
          git commit -m "style: format cross-provider release identity"
          git push origin HEAD:manh/integrate-production-api
