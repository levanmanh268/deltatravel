name: One-time tour UX formatting

on:
  push:
    branches:
      - manh/integrate-production-api
    paths:
      - .github/workflows/format-tour-ux-once.yml
      - apps/web/src/components/tour-photo-gallery.tsx
      - apps/web/src/components/tour-reviews.tsx
      - apps/web/src/lib/tour-assets.ts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/components/tour-photo-gallery.tsx apps/web/src/components/tour-reviews.tsx apps/web/src/lib/tour-assets.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/tour-photo-gallery.tsx apps/web/src/components/tour-reviews.tsx apps/web/src/lib/tour-assets.ts
          git commit -m "style: prettier tour gallery and reviews"
          git push origin HEAD:manh/integrate-production-api
