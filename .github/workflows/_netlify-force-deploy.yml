name: Temporary Netlify Force Deploy

on:
  push:
    branches:
      - fix/netlify-contract-skew-20261001

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Netlify credentials exist
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "HAS_NETLIFY_AUTH_TOKEN=false"
            exit 42
          fi
          echo "HAS_NETLIFY_AUTH_TOKEN=true"
          if [ -n "$NETLIFY_SITE_ID" ]; then
            echo "HAS_NETLIFY_SITE_ID=true"
          else
            echo "HAS_NETLIFY_SITE_ID=false"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Netlify CLI and browser probe
        run: npm install --no-save netlify-cli playwright

      - name: Resolve DELTA TRAVEL Netlify site
        shell: bash
        run: |
          if [ -n "$NETLIFY_SITE_ID" ]; then
            echo "RESOLVED_NETLIFY_SITE_ID=$NETLIFY_SITE_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          npx netlify sites:list --auth "$NETLIFY_AUTH_TOKEN" --json > /tmp/netlify-sites.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const sites = JSON.parse(fs.readFileSync('/tmp/netlify-sites.json', 'utf8'));
          const site = sites.find((item) => {
            const values = [item.name, item.url, item.ssl_url, item.admin_url]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
            return values.includes('deltatravel') || values.includes('deltatravel.netlify.app');
          });
          if (!site?.id) {
            console.error('Unable to resolve DELTA TRAVEL Netlify site from connected account');
            process.exit(43);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'RESOLVED_NETLIFY_SITE_ID=' + site.id + '\n');
          console.log('NETLIFY_SITE_RESOLVED', site.name || 'unnamed');
          JS

      - name: Deploy main to Netlify production
        shell: bash
        run: |
          npx netlify deploy             --prod             --build             --auth "$NETLIFY_AUTH_TOKEN"             --site "$RESOLVED_NETLIFY_SITE_ID"             --message "DELTA TRAVEL contract-skew hotfix 6154a53"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Netlify production catalog
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const WEB = 'https://deltatravel.netlify.app';
          const releaseResponse = await fetch(WEB + '/api/release', { cache: 'no-store' });
          if (!releaseResponse.ok) throw new Error('Netlify /api/release returned ' + releaseResponse.status);
          const release = await releaseResponse.json();
          console.log('NETLIFY_RELEASE_AFTER_DEPLOY', JSON.stringify(release));

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            await page.addInitScript(() => sessionStorage.setItem('delta_intro_played', 'true'));
            const response = await page.goto(WEB + '/tours', {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });
            console.log('NETLIFY_TOURS_HTTP_AFTER_DEPLOY', response?.status());
            await page.waitForTimeout(8000);
            const body = await page.locator('body').innerText();
            for (const marker of [
              'Không thể tải catalog tour production',
              'unrecognized_keys',
              'API_CONTRACT_MISMATCH',
              'Website và máy chủ đang chưa đồng bộ phiên bản dữ liệu',
            ]) {
              if (body.includes(marker)) {
                throw new Error('Catalog still exposes failure marker: ' + marker);
              }
            }
            const tourLinks = await page.locator('a[href^="/tours/"]').count();
            console.log('NETLIFY_TOUR_LINKS_AFTER_DEPLOY', tourLinks);
            if (tourLinks < 1) throw new Error('Netlify production rendered no tour cards');
            if (pageErrors.length) throw new Error('Netlify page errors: ' + pageErrors.join(' | '));
            console.log('NETLIFY_FORCE_DEPLOY_PASS');
          } finally {
            await browser.close();
          }
          JS
