name: Temporary Live Smoke

on:
  push:
    branches:
      - manh/upstream-ai-first-release

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live web and API
        env:
          WEB: https://delta-travel-web.onrender.com
          API: https://delta-travel-api.onrender.com/api/v1
        run: |
          node <<'NODE'
          const WEB = process.env.WEB;
          const API = process.env.API;

          async function get(url) {
            const res = await fetch(url, { redirect: 'follow' });
            const text = await res.text();
            if (!res.ok) throw new Error(`GET ${url} -> ${res.status}: ${text.slice(0,300)}`);
            return { res, text };
          }

          async function json(url, init = {}) {
            const res = await fetch(url, init);
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            if (!res.ok) throw new Error(`${init.method || 'GET'} ${url} -> ${res.status}: ${text.slice(0,500)}`);
            return body?.data ?? body;
          }

          for (const path of ['/', '/assistant', '/tours']) {
            const { text } = await get(WEB + path);
            if (!text || text.length < 100) throw new Error(`Web route ${path} returned unexpectedly small HTML`);
            console.log('PASS web', path);
          }

          const ready = await json(API + '/health/ready');
          if (ready?.status !== 'ok') throw new Error('health/ready did not return status=ok');
          console.log('PASS health/ready');

          const provider = await json(API + '/assistant/provider-status');
          console.log('PASS assistant/provider-status', JSON.stringify({
            preferredProvider: provider?.preferredProvider,
            groqConfigured: provider?.groqConfigured,
            geminiConfigured: provider?.geminiConfigured,
            fallbackAvailable: provider?.fallbackAvailable,
          }));

          const payments = await json(API + '/payments/providers/status');
          if (!Array.isArray(payments?.providers)) throw new Error('payments/providers/status missing providers array');
          console.log('PASS payments/providers/status', JSON.stringify(payments.providers));

          const integrations = await json(API + '/health/integrations');
          console.log('PASS health/integrations', JSON.stringify(integrations));

          const chat = await json(API + '/assistant/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Origin': WEB,
              'X-CSRF-Protection': '1',
            },
            body: JSON.stringify({
              message: 'Tìm tour Đà Nẵng cho 2 người lớn ngân sách 8 triệu',
              history: [],
            }),
          });
          if (!chat || !Array.isArray(chat.sources)) throw new Error('assistant/chat missing expected response shape');
          console.log('PASS assistant/chat', JSON.stringify({mode: chat.mode, sources: chat.sources.length}));

          console.log('LIVE_SMOKE_PASS');
          NODE
