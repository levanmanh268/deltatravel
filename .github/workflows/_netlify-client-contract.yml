name: Temporary Netlify Client Contract Check

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Inspect client API requests
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          try {
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const urls = [];
            page.on('request', req => {
              if (req.url().includes('delta-travel-api.onrender.com/api/v1/tours')) urls.push(req.url());
            });
            await page.addInitScript(() => sessionStorage.setItem('delta_intro_played','true'));
            await page.goto('https://deltatravel.netlify.app/', {waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            await page.goto('https://deltatravel.netlify.app/tours', {waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            console.log('TOUR_REQUESTS', JSON.stringify(urls));
            console.log('USES_V2', urls.some(url => url.includes('contract=v2')));
            console.log('CLIENT_CONTRACT_CHECK_PASS');
          } finally { await browser.close(); }
          JS
