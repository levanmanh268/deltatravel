name: Temporary Netlify UI Verification

on:
  push:
    branches:
      - manh/final-hardening-v3-20260930

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify Netlify catalog is usable
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          try {
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });
            await page.addInitScript(() => sessionStorage.setItem('delta_intro_played','true'));
            const response = await page.goto('https://deltatravel.netlify.app/', {
              waitUntil:'domcontentloaded',
              timeout:120000
            });
            console.log('HOME_STATUS', response?.status());
            await page.waitForTimeout(5000);
            const body = await page.locator('body').innerText();
            console.log('BODY_HEAD', body.slice(0,2500));
            console.log('UNRECOGNIZED_KEYS', body.includes('unrecognized_keys'));
            console.log('CATALOG_ERROR', body.includes('Không thể tải catalog tour production'));
            console.log('TOUR_LINKS', await page.locator('a[href^="/tours/"]').count());
            if (body.includes('unrecognized_keys')) throw new Error('Netlify still shows Zod unrecognized_keys');
            if (body.includes('Không thể tải catalog tour production')) throw new Error('Netlify still shows catalog production error');
            const links = await page.locator('a[href^="/tours/"]').count();
            if (links < 1) throw new Error('Netlify homepage has no tour links');
            await page.goto('https://deltatravel.netlify.app/tours', {
              waitUntil:'domcontentloaded',
              timeout:120000
            });
            await page.waitForTimeout(4000);
            const toursBody = await page.locator('body').innerText();
            console.log('TOURS_BODY_HEAD', toursBody.slice(0,1800));
            if (toursBody.includes('unrecognized_keys')) throw new Error('/tours still shows Zod contract error');
            if (toursBody.includes('Không thể tải catalog tour production')) throw new Error('/tours still shows production catalog error');
            console.log('TOURS_LINKS', await page.locator('a[href^="/tours/"]').count());
            if (errors.length) console.log('PAGE_ERRORS', JSON.stringify(errors));
            console.log('NETLIFY_UI_VERIFY_PASS');
          } finally {
            await browser.close();
          }
          JS
