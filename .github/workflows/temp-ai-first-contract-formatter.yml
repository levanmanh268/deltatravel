name: Temporary AI First Contract Formatter

on:
  push:
    branches:
      - manh/ai-first-everywhere

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/ai-first-everywhere
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-ai-first.mjs
      - run: rm .github/workflows/temp-ai-first-contract-formatter.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format expanded AI-first contract"
          git push origin HEAD:manh/ai-first-everywhere
