name: Normalize followup

on:
  push:
    branches:
      - manh/tham-followup-verification-20261007

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[followup-normalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/tham-followup-verification-20261007
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format followup files
        run: npx prettier --write "apps/web/src/app/page.tsx" "apps/web/src/app/(public)/tours/page.tsx" "apps/api/test/integration/content-review.test.ts"
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "delta-travel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "chore: normalize customer duration followup [followup-normalize]"
          git push origin HEAD:manh/tham-followup-verification-20261007
