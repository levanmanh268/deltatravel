name: Sync latest verified main to production

on:
  push:
    branches:
      - manh/integrate-production-api

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[followup-production-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
          fetch-depth: 0
      - name: Replace production tree with latest verified main
        run: |
          set -euo pipefail
          git config user.name "delta-travel-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git read-tree --reset -u origin/main
          if git diff --cached --quiet; then
            echo "Production already matches main"
            exit 0
          fi
          git commit -m "release: sync followup into production [followup-production-sync]"
          git push origin HEAD:manh/integrate-production-api
